<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elanillo - Login y Registro</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f6f7fb, #e8eefc);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .auth-card {
        width: min(420px, 90vw);
        background: white;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tab {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
        background: #edf2ff;
        color: #345;
      }
      .tab.active {
        background: #2f6fed;
        color: white;
      }
      .text-link {
        border: 0;
        padding: 0;
        background: transparent;
        color: #1d4ed8;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .helper {
        margin: -4px 0 0;
        font-size: 0.9rem;
        color: #475569;
      }
      .dev-link {
        display: block;
        margin-top: 8px;
        overflow-wrap: anywhere;
        font-size: 0.85rem;
      }
      form {
        display: none;
        flex-direction: column;
        gap: 14px;
      }
      form.active {
        display: flex;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9rem;
        color: #334155;
      }
      input {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      button[type="submit"] {
        border: none;
        border-radius: 10px;
        padding: 12px;
        background: #1d4ed8;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #64748b;
        font-size: 0.85rem;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
      }
      .sso-button {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px;
        background: white;
        color: #1e293b;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .sso-button:hover { background: #f8fafc; }
      .sso-button:disabled { opacity: 0.6; cursor: wait; }
      textarea {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
        font-family: inherit;
        resize: vertical;
      }
      .projects-card {
        width: min(560px, 92vw);
        background: white;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }
      .projects-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }
      .projects-header h1 { margin: 0; font-size: 1.3rem; color: #1e293b; }
      .projects-header .helper { margin: 4px 0 0; }
      .projects-card h2 { margin: 24px 0 12px; font-size: 1.05rem; color: #1e293b; }
      #projectForm { display: flex; }
      .project-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .project-item {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 14px 16px;
      }
      .project-item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .project-name { font-weight: 700; color: #1e293b; overflow-wrap: anywhere; }
      .project-description { margin: 6px 0 0; font-size: 0.9rem; color: #475569; overflow-wrap: anywhere; }
      .project-meta { margin: 8px 0 0; font-size: 0.8rem; color: #64748b; }
      .role-badge {
        flex-shrink: 0;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        background: #edf2ff;
        color: #1d4ed8;
      }
      .role-badge.owner { background: #dcfce7; color: #15803d; }
      .empty-state { color: #64748b; font-size: 0.92rem; margin: 0; }
      button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
      .status {
        min-height: 20px;
        margin-top: 10px;
        font-size: 0.92rem;
      }
      .status.error { color: #b91c1c; }
      .status.success { color: #15803d; }
    </style>
  </head>
  <body>
    <div class="auth-card" id="authView">
      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Iniciar sesión</button>
        <button class="tab" data-tab="register" type="button">Registrarse</button>
      </div>

      <form id="loginForm" class="active">
        <label>
          Email
          <input type="email" name="username" placeholder="test@example.com" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="********" required />
        </label>
        <button type="submit">Entrar</button>
        <button class="text-link" id="forgotPasswordLink" type="button">¿Olvidaste tu contraseña?</button>
        <div class="divider">o</div>
        <!-- type="button": no envía el formulario, solo redirige al backend que inicia el flujo SSO -->
        <button class="sso-button" id="ssoGoogleButton" type="button">Continuar con Google</button>
      </form>

      <form id="registerForm">
        <label>
          Nombre completo
          <input type="text" name="name" placeholder="Tu nombre" required />
        </label>
        <label>
          Email
          <input type="email" name="username" placeholder="tu@email.com" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="Mínimo 6 caracteres" required />
        </label>
        <button type="submit">Crear cuenta</button>
      </form>

      <form id="forgotForm">
        <p class="helper">Ingresa tu correo y te enviaremos instrucciones para recuperar el acceso.</p>
        <label>
          Email
          <input type="email" name="username" placeholder="tu@email.com" required />
        </label>
        <button type="submit">Enviar instrucciones</button>
        <button class="text-link" id="backToLoginLink" type="button">Volver a iniciar sesión</button>
      </form>

      <form id="resetForm">
        <p class="helper">Define una nueva contraseña para tu cuenta.</p>
        <label>
          Nueva contraseña
          <input type="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required />
        </label>
        <label>
          Confirmar contraseña
          <input type="password" name="passwordConfirmation" minlength="6" placeholder="Repite tu contraseña" required />
        </label>
        <button type="submit">Restablecer contraseña</button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <!-- Vista de proyectos: se muestra cuando hay sesión activa y reemplaza a la tarjeta de login -->
    <div class="projects-card" id="projectsView" hidden>
      <div class="projects-header">
        <div>
          <h1>Mis proyectos</h1>
          <p class="helper" id="sessionUser"></p>
        </div>
        <button class="text-link" id="logoutButton" type="button">Cerrar sesión</button>
      </div>

      <ul class="project-list" id="projectList"></ul>

      <h2>Crear proyecto</h2>
      <form id="projectForm">
        <label>
          Nombre
          <input type="text" name="name" maxlength="80" placeholder="Ej: Rediseño del sitio" required />
        </label>
        <label>
          Descripción (opcional)
          <textarea name="description" rows="3" maxlength="300" placeholder="¿De qué trata el proyecto?"></textarea>
        </label>
        <button type="submit" id="projectSubmit">Crear proyecto</button>
      </form>
      <div id="projectsStatus" class="status"></div>
    </div>

    <script>
      const apiBase = 'http://localhost:3001';
      const tabs = document.querySelectorAll('.tab');
      const forms = {
        login: document.getElementById('loginForm'),
        register: document.getElementById('registerForm'),
        forgot: document.getElementById('forgotForm'),
        reset: document.getElementById('resetForm'),
      };
      const statusEl = document.getElementById('status');
      const resetToken = new URLSearchParams(window.location.search).get('token');

      function setMessage(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      function showForm(target) {
        tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === target));
        Object.entries(forms).forEach(([key, form]) => {
          form.classList.toggle('active', key === target);
        });
        setMessage('');
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const target = tab.dataset.tab;
          showForm(target);
        });
      });

      document.getElementById('forgotPasswordLink').addEventListener('click', () => showForm('forgot'));
      document.getElementById('backToLoginLink').addEventListener('click', () => showForm('login'));

      // --- Sesión: renovación automática del access token ---
      // Si el servidor responde 401, se intenta /api/refresh una sola vez y se repite la petición.
      // Se comparte una única renovación en curso: el refresh token es de un solo uso, así que
      // dos renovaciones en paralelo harían que la segunda fallara.
      let refreshInFlight = null;

      function refreshSession() {
        if (!refreshInFlight) {
          refreshInFlight = fetch(`${apiBase}/api/refresh`, { method: 'POST', credentials: 'include' })
            .then((response) => response.ok)
            .catch(() => false)
            .finally(() => { refreshInFlight = null; });
        }
        return refreshInFlight;
      }

      // Usar esta función en vez de fetch para cualquier ruta protegida.
      async function fetchWithRefresh(path, options = {}) {
        const send = () => fetch(`${apiBase}${path}`, { ...options, credentials: 'include' });
        let response = await send();
        if (response.status === 401 && (await refreshSession())) {
          response = await send();
        }
        return response;
      }

      // --- Vistas: login <-> proyectos ---
      const authView = document.getElementById('authView');
      const projectsView = document.getElementById('projectsView');
      const projectListEl = document.getElementById('projectList');
      const projectForm = document.getElementById('projectForm');
      const projectSubmit = document.getElementById('projectSubmit');
      const projectsStatusEl = document.getElementById('projectsStatus');

      const roleLabels = { owner: 'Propietario', editor: 'Editor', viewer: 'Lector' };
      let projects = [];

      function setProjectsMessage(message, type = '') {
        projectsStatusEl.textContent = message;
        projectsStatusEl.className = `status ${type}`.trim();
      }

      // Vuelve a la pantalla de login (cierre de sesión o sesión vencida).
      function showAuthView(message = '', type = '') {
        projects = [];
        projectsView.hidden = true;
        authView.hidden = false;
        showForm('login');
        if (message) setMessage(message, type);
      }

      // Con sesión activa: muestra la vista de proyectos y carga la lista.
      function showSession(user) {
        authView.hidden = true;
        projectsView.hidden = false;
        document.getElementById('sessionUser').textContent = user?.name || user?.username || '';
        setProjectsMessage('');
        loadProjects();
      }

      // Se arma el DOM con textContent (no innerHTML): el nombre y la descripción los escribe el usuario,
      // y con innerHTML un nombre como <img onerror=...> ejecutaría código en el navegador (XSS).
      function renderProjects() {
        projectListEl.replaceChildren();

        if (projects.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = 'Aún no tienes proyectos. Crea el primero abajo.';
          projectListEl.appendChild(empty);
          return;
        }

        projects.forEach((project) => {
          const item = document.createElement('li');
          item.className = 'project-item';

          const top = document.createElement('div');
          top.className = 'project-item-top';
          const name = document.createElement('span');
          name.className = 'project-name';
          name.textContent = project.name;
          const badge = document.createElement('span');
          badge.className = `role-badge ${project.role}`;
          badge.textContent = roleLabels[project.role] || project.role;
          top.append(name, badge);
          item.appendChild(top);

          if (project.description) {
            const description = document.createElement('p');
            description.className = 'project-description';
            description.textContent = project.description;
            item.appendChild(description);
          }

          const meta = document.createElement('p');
          meta.className = 'project-meta';
          meta.textContent = `${project.memberCount} ${project.memberCount === 1 ? 'miembro' : 'miembros'}`;
          item.appendChild(meta);

          projectListEl.appendChild(item);
        });
      }

      // Si el servidor responde 401 incluso después de intentar renovar, la sesión terminó.
      function handleSessionExpired() {
        showAuthView('Tu sesión expiró. Inicia sesión de nuevo.', 'error');
      }

      async function loadProjects() {
        projectListEl.replaceChildren();
        const loading = document.createElement('li');
        loading.className = 'empty-state';
        loading.textContent = 'Cargando proyectos...';
        projectListEl.appendChild(loading);

        try {
          const response = await fetchWithRefresh('/api/projects');
          if (response.status === 401) return handleSessionExpired();
          const data = await response.json();
          if (!response.ok) {
            projectListEl.replaceChildren();
            setProjectsMessage(data.error || 'No se pudieron cargar los proyectos', 'error');
            return;
          }
          projects = data.projects;
          renderProjects();
        } catch (error) {
          projectListEl.replaceChildren();
          setProjectsMessage('No se pudo conectar con el servidor', 'error');
        }
      }

      projectForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(projectForm);
        const payload = {
          name: String(formData.get('name') || '').trim(),
          description: String(formData.get('description') || '').trim(),
        };

        // Validación en el cliente para dar feedback inmediato (el servidor valida igual).
        if (!payload.name) {
          setProjectsMessage('El nombre del proyecto es obligatorio', 'error');
          return;
        }

        projectSubmit.disabled = true; // evita crear duplicados con doble clic
        setProjectsMessage('Creando proyecto...');
        try {
          const response = await fetchWithRefresh('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (response.status === 401) return handleSessionExpired();
          const data = await response.json();

          if (!response.ok) {
            setProjectsMessage(data.error || 'No se pudo crear el proyecto', 'error');
            return;
          }

          projects.unshift(data.project); // el más nuevo arriba, igual que el orden del servidor
          renderProjects();
          projectForm.reset();
          setProjectsMessage(`Proyecto "${data.project.name}" creado`, 'success');
        } catch (error) {
          setProjectsMessage('No se pudo conectar con el servidor', 'error');
        } finally {
          projectSubmit.disabled = false;
        }
      });

      document.getElementById('logoutButton').addEventListener('click', async () => {
        try {
          await fetch(`${apiBase}/api/logout`, { method: 'POST', credentials: 'include' });
          showAuthView('Sesión cerrada', 'success');
        } catch (error) {
          setProjectsMessage('No se pudo cerrar la sesión', 'error');
        }
      });

      async function restoreSession({ announceFailure = false } = {}) {
        try {
          const response = await fetchWithRefresh('/api/me');
          if (!response.ok) {
            if (announceFailure) setMessage(ssoErrorMessages.sso_failed, 'error');
            return;
          }
          const data = await response.json();
          showSession(data.user);
        } catch (error) {
          if (announceFailure) setMessage('No se pudo conectar con el servidor', 'error');
        }
      }

      // --- SSO ---
      const ssoErrorMessages = {
        sso_not_configured: 'El inicio de sesión con Google no está configurado en el servidor.',
        access_denied: 'Cancelaste el inicio de sesión con Google.',
        invalid_state: 'La solicitud de inicio de sesión no es válida o expiró. Intenta de nuevo.',
        email_not_verified: 'Tu cuenta de Google no tiene el correo verificado.',
        account_exists: 'Ese correo ya está registrado con contraseña. Inicia sesión con tu contraseña.',
        sso_failed: 'No se pudo completar el inicio de sesión con Google.',
      };

      // El botón solo navega al backend, que redirige a Google (no se puede usar fetch: es un redirect entre sitios).
      document.getElementById('ssoGoogleButton').addEventListener('click', (event) => {
        event.currentTarget.disabled = true;
        setMessage('Redirigiendo a Google...');
        window.location.href = `${apiBase}/api/auth/google`;
      });

      // Al volver de Google, el backend redirige a esta página con ?sso=success o ?sso_error=<código>.
      const urlParams = new URLSearchParams(window.location.search);
      const ssoError = urlParams.get('sso_error');
      const ssoSuccess = urlParams.get('sso') === 'success';
      if (ssoError || ssoSuccess) {
        // Se limpia la URL para que un F5 no repita el mensaje.
        window.history.replaceState({}, '', window.location.pathname);
      }

      forms.login.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.login);
        const payload = {
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch(`${apiBase}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'Error al iniciar sesión', 'error');
            return;
          }

          showSession(data.user);
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      forms.forgot.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.forgot);

        try {
          const response = await fetch(`${apiBase}/api/request-password-reset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: formData.get('username') }),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'No se pudo solicitar la recuperación', 'error');
            return;
          }

          setMessage(data.message, 'success');
          forms.forgot.reset();
          if (data.resetToken) {
            const resetUrl = `${window.location.origin}${window.location.pathname}?token=${encodeURIComponent(data.resetToken)}`;
            const link = document.createElement('a');
            link.className = 'dev-link';
            link.href = resetUrl;
            link.textContent = 'Abrir enlace de recuperación (desarrollo)';
            statusEl.appendChild(link);
          }
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      forms.reset.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.reset);
        const password = formData.get('password');
        const passwordConfirmation = formData.get('passwordConfirmation');

        if (password !== passwordConfirmation) {
          setMessage('Las contraseñas no coinciden', 'error');
          return;
        }

        try {
          const response = await fetch(`${apiBase}/api/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'No se pudo restablecer la contraseña', 'error');
            return;
          }

          setMessage(`${data.message}. Ya puedes iniciar sesión.`, 'success');
          forms.reset.reset();
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      if (resetToken) {
        tabs.forEach((tab) => { tab.hidden = true; });
        showForm('reset');
      } else if (ssoError) {
        setMessage(ssoErrorMessages[ssoError] || ssoErrorMessages.sso_failed, 'error');
      } else {
        // Con ?sso=success se confirma la sesión y, si falla, se avisa.
        // Sin parámetros solo se restaura una sesión previa (renovándola si hace falta), sin mostrar errores.
        restoreSession({ announceFailure: ssoSuccess });
      }

      forms.register.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.register);
        const payload = {
          name: formData.get('name'),
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch(`${apiBase}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'Error al registrar usuario', 'error');
            return;
          }

          setMessage('Registro exitoso. Ya puedes iniciar sesión.', 'success');
          forms.register.reset();
          tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === 'login'));
          Object.entries(forms).forEach(([key, form]) => {
            form.classList.toggle('active', key === 'login');
          });
        } catch (error) {
          setMessage('No se pudo completar el registro', 'error');
        }
      });
    </script>
  </body>
</html>
