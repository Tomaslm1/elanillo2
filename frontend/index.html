<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elanillo - Login y Registro</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f6f7fb, #e8eefc);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .auth-card {
        width: min(420px, 90vw);
        background: white;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tab {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
        background: #edf2ff;
        color: #345;
      }
      .tab.active {
        background: #2f6fed;
        color: white;
      }
      .text-link {
        border: 0;
        padding: 0;
        background: transparent;
        color: #1d4ed8;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .helper {
        margin: -4px 0 0;
        font-size: 0.9rem;
        color: #475569;
      }
      .dev-link {
        display: block;
        margin-top: 8px;
        overflow-wrap: anywhere;
        font-size: 0.85rem;
      }
      form {
        display: none;
        flex-direction: column;
        gap: 14px;
      }
      form.active {
        display: flex;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9rem;
        color: #334155;
      }
      input {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      button[type="submit"] {
        border: none;
        border-radius: 10px;
        padding: 12px;
        background: #1d4ed8;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        min-height: 20px;
        margin-top: 10px;
        font-size: 0.92rem;
      }
      .status.error { color: #b91c1c; }
      .status.success { color: #15803d; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Iniciar sesión</button>
        <button class="tab" data-tab="register" type="button">Registrarse</button>
      </div>

      <form id="loginForm" class="active">
        <label>
          Email
          <input type="email" name="username" placeholder="test@example.com" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="********" required />
        </label>
        <button type="submit">Entrar</button>
        <button class="text-link" id="forgotPasswordLink" type="button">¿Olvidaste tu contraseña?</button>
      </form>

      <form id="registerForm">
        <label>
          Nombre completo
          <input type="text" name="name" placeholder="Tu nombre" required />
        </label>
        <label>
          Email
          <input type="email" name="username" placeholder="tu@email.com" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="Mínimo 6 caracteres" required />
        </label>
        <button type="submit">Crear cuenta</button>
      </form>

      <form id="forgotForm">
        <p class="helper">Ingresa tu correo y te enviaremos instrucciones para recuperar el acceso.</p>
        <label>
          Email
          <input type="email" name="username" placeholder="tu@email.com" required />
        </label>
        <button type="submit">Enviar instrucciones</button>
        <button class="text-link" id="backToLoginLink" type="button">Volver a iniciar sesión</button>
      </form>

      <form id="resetForm">
        <p class="helper">Define una nueva contraseña para tu cuenta.</p>
        <label>
          Nueva contraseña
          <input type="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required />
        </label>
        <label>
          Confirmar contraseña
          <input type="password" name="passwordConfirmation" minlength="6" placeholder="Repite tu contraseña" required />
        </label>
        <button type="submit">Restablecer contraseña</button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <script>
      const apiBase = 'http://localhost:3001';
      const tabs = document.querySelectorAll('.tab');
      const forms = {
        login: document.getElementById('loginForm'),
        register: document.getElementById('registerForm'),
        forgot: document.getElementById('forgotForm'),
        reset: document.getElementById('resetForm'),
      };
      const statusEl = document.getElementById('status');
      const resetToken = new URLSearchParams(window.location.search).get('token');

      function setMessage(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      function showForm(target) {
        tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === target));
        Object.entries(forms).forEach(([key, form]) => {
          form.classList.toggle('active', key === target);
        });
        setMessage('');
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const target = tab.dataset.tab;
          showForm(target);
        });
      });

      document.getElementById('forgotPasswordLink').addEventListener('click', () => showForm('forgot'));
      document.getElementById('backToLoginLink').addEventListener('click', () => showForm('login'));

      forms.login.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.login);
        const payload = {
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch(`${apiBase}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'Error al iniciar sesión', 'error');
            return;
          }

          setMessage(`Bienvenido ${data.user?.name || data.user?.username}`, 'success');
          console.log('Login ok:', data);
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      forms.forgot.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.forgot);

        try {
          const response = await fetch(`${apiBase}/api/request-password-reset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: formData.get('username') }),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'No se pudo solicitar la recuperación', 'error');
            return;
          }

          setMessage(data.message, 'success');
          forms.forgot.reset();
          if (data.resetToken) {
            const resetUrl = `${window.location.origin}${window.location.pathname}?token=${encodeURIComponent(data.resetToken)}`;
            const link = document.createElement('a');
            link.className = 'dev-link';
            link.href = resetUrl;
            link.textContent = 'Abrir enlace de recuperación (desarrollo)';
            statusEl.appendChild(link);
          }
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      forms.reset.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.reset);
        const password = formData.get('password');
        const passwordConfirmation = formData.get('passwordConfirmation');

        if (password !== passwordConfirmation) {
          setMessage('Las contraseñas no coinciden', 'error');
          return;
        }

        try {
          const response = await fetch(`${apiBase}/api/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'No se pudo restablecer la contraseña', 'error');
            return;
          }

          setMessage(`${data.message}. Ya puedes iniciar sesión.`, 'success');
          forms.reset.reset();
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      if (resetToken) {
        tabs.forEach((tab) => { tab.hidden = true; });
        showForm('reset');
      }

      forms.register.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.register);
        const payload = {
          name: formData.get('name'),
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch(`${apiBase}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'Error al registrar usuario', 'error');
            return;
          }

          setMessage('Registro exitoso. Ya puedes iniciar sesión.', 'success');
          forms.register.reset();
          tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === 'login'));
          Object.entries(forms).forEach(([key, form]) => {
            form.classList.toggle('active', key === 'login');
          });
        } catch (error) {
          setMessage('No se pudo completar el registro', 'error');
        }
      });
    </script>
  </body>
</html>
