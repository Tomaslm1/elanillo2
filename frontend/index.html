<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ideator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Ideator · azul marino + dorado, tipografía de código (mismos tokens que project.css). */
      :root {
        --bg: #060e1d; --surface: #0b1730; --surface-2: #10203f; --line: #1d3461; --line-strong: #2a4a85;
        --text: #e6ecf7; --muted: #8b9cc0; --blue: #4c8dff; --blue-soft: rgba(76, 141, 255, 0.14);
        --gold: #d6b25e; --gold-strong: #e8c66f; --gold-soft: rgba(214, 178, 94, 0.13);
        --ok: #3ccf91; --err: #ff6b7a;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      html { color-scheme: dark; }
      body {
        margin: 0; font-family: var(--sans); color: var(--text); min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px 16px;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse at top, rgba(76, 141, 255, 0.14), transparent 60%),
          linear-gradient(rgba(76, 141, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(76, 141, 255, 0.045) 1px, transparent 1px);
        background-size: 100% 100%, 32px 32px, 32px 32px;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--gold); color: var(--bg); }
      .brand { font-family: var(--mono); font-weight: 700; font-size: 1.9rem; color: var(--gold); letter-spacing: -0.03em; text-align: center; }
      .brand .cursor { color: var(--blue); animation: blink 1.1s steps(1) infinite; }
      .tagline { display: block; font-family: var(--mono); font-size: 0.75rem; font-weight: 400; color: var(--muted); letter-spacing: 0.02em; margin-top: 6px; }
      @keyframes blink { 50% { opacity: 0; } }
      .auth-card, .projects-card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(214, 178, 94, 0.18);
      }
      .auth-card { width: min(420px, 92vw); }
      .projects-card { width: min(600px, 92vw); }
      .tabs { display: flex; gap: 4px; margin-bottom: 22px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
      .tab {
        flex: 1; border: none; border-radius: 7px; padding: 8px 12px; font-family: var(--mono); font-weight: 600; font-size: 0.8rem;
        cursor: pointer; background: transparent; color: var(--muted);
      }
      .tab:hover { color: var(--text); }
      .tab.active { background: var(--surface-2); color: var(--gold); box-shadow: inset 0 0 0 1px var(--line-strong); }
      .text-link { border: 0; padding: 0; background: transparent; color: var(--blue); cursor: pointer; font: inherit; font-size: 0.85rem; text-align: left; }
      .text-link:hover { color: var(--gold); }
      .helper { margin: -4px 0 0; font-size: 0.85rem; color: var(--muted); }
      .dev-link { display: block; margin-top: 8px; overflow-wrap: anywhere; font-size: 0.8rem; font-family: var(--mono); color: var(--blue); }
      form { display: none; flex-direction: column; gap: 14px; }
      form.active { display: flex; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 0.72rem; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
      input, textarea {
        border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 13px; font-size: 0.95rem; font-family: var(--sans);
        background: var(--bg); color: var(--text); text-transform: none; letter-spacing: normal; transition: border-color 0.15s, box-shadow 0.15s;
      }
      input::placeholder, textarea::placeholder { color: #5d6f95; }
      input:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
      textarea { resize: vertical; }
      button[type="submit"] {
        border: 1px solid var(--gold); border-radius: 10px; padding: 11px; background: var(--gold); color: #0a1428;
        font-family: var(--mono); font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: background 0.15s, box-shadow 0.15s;
      }
      button[type="submit"]:hover:not(:disabled) { background: var(--gold-strong); box-shadow: 0 0 0 3px var(--gold-soft); }
      button[type="submit"]:disabled { opacity: 0.5; cursor: wait; }
      .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.75rem; font-family: var(--mono); }
      .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
      .sso-button {
        border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px; background: transparent; color: var(--text);
        font-family: var(--mono); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s, background 0.15s;
      }
      .sso-button:hover { border-color: var(--blue); background: var(--blue-soft); }
      .sso-button:disabled { opacity: 0.6; cursor: wait; }
      .projects-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
      .projects-header h1 { margin: 0; font-size: 1.05rem; font-family: var(--mono); color: var(--text); }
      .projects-header h1::before { content: '~/'; color: var(--muted); font-weight: 400; }
      .projects-header .helper { margin: 4px 0 0; font-family: var(--mono); font-size: 0.75rem; }
      .projects-card h2 { margin: 26px 0 12px; font-size: 0.78rem; font-family: var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: 0.07em; }
      .projects-card h2::before { content: '// '; color: var(--muted); }
      #projectForm { display: flex; }
      .project-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .project-item {
        border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; background: var(--surface-2);
        cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      }
      .project-item:hover, .project-item:focus-visible { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); outline: none; }
      .project-item-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .project-name { font-weight: 600; font-family: var(--mono); font-size: 0.92rem; color: var(--text); overflow-wrap: anywhere; }
      .project-description { margin: 6px 0 0; font-size: 0.86rem; color: var(--muted); overflow-wrap: anywhere; }
      .project-meta { margin: 8px 0 0; font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
      .role-badge {
        flex-shrink: 0; border-radius: 999px; padding: 2px 10px; font-size: 0.7rem; font-weight: 600; font-family: var(--mono);
        background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(76, 141, 255, 0.35);
      }
      .role-badge.owner { background: var(--gold-soft); color: var(--gold); border-color: rgba(214, 178, 94, 0.45); }
      .role-badge.viewer { background: transparent; color: var(--muted); border-color: var(--line-strong); }
      .empty-state { color: var(--muted); font-size: 0.88rem; margin: 0; font-style: italic; }
      .status { min-height: 20px; margin-top: 10px; font-size: 0.82rem; font-family: var(--mono); }
      .status.error { color: var(--err); }
      .status.success { color: var(--ok); }
    </style>
  </head>
  <body>
    <div class="brand">ideator<span class="cursor">_</span><span class="tagline">de una idea a una especificación lista para construir</span></div>
    <div class="auth-card" id="authView">
      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Iniciar sesión</button>
        <button class="tab" data-tab="register" type="button">Registrarse</button>
      </div>

      <form id="loginForm" class="active">
        <label>
          Email
          <input type="email" name="username" placeholder="test@example.com" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="********" required />
        </label>
        <button type="submit">Entrar</button>
        <button class="text-link" id="forgotPasswordLink" type="button">¿Olvidaste tu contraseña?</button>
        <div class="divider">o</div>
        <!-- type="button": no envía el formulario, solo redirige al backend que inicia el flujo SSO -->
        <button class="sso-button" id="ssoGoogleButton" type="button">Continuar con Google</button>
      </form>

      <form id="registerForm">
        <label>
          Nombre completo
          <input type="text" name="name" placeholder="Tu nombre" required />
        </label>
        <label>
          Email
          <input type="email" name="username" placeholder="tu@email.com" required />
        </label>
        <label>
          Contraseña
          <input type="password" name="password" placeholder="Mínimo 6 caracteres" required />
        </label>
        <button type="submit">Crear cuenta</button>
      </form>

      <form id="forgotForm">
        <p class="helper">Ingresa tu correo y te enviaremos instrucciones para recuperar el acceso.</p>
        <label>
          Email
          <input type="email" name="username" placeholder="tu@email.com" required />
        </label>
        <button type="submit">Enviar instrucciones</button>
        <button class="text-link" id="backToLoginLink" type="button">Volver a iniciar sesión</button>
      </form>

      <form id="resetForm">
        <p class="helper">Define una nueva contraseña para tu cuenta.</p>
        <label>
          Nueva contraseña
          <input type="password" name="password" minlength="6" placeholder="Mínimo 6 caracteres" required />
        </label>
        <label>
          Confirmar contraseña
          <input type="password" name="passwordConfirmation" minlength="6" placeholder="Repite tu contraseña" required />
        </label>
        <button type="submit">Restablecer contraseña</button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <!-- Vista de proyectos: se muestra cuando hay sesión activa y reemplaza a la tarjeta de login -->
    <div class="projects-card" id="projectsView" hidden>
      <div class="projects-header">
        <div>
          <h1>Mis proyectos</h1>
          <p class="helper" id="sessionUser"></p>
        </div>
        <button class="text-link" id="logoutButton" type="button">Cerrar sesión</button>
      </div>

      <ul class="project-list" id="projectList"></ul>

      <h2>Crear proyecto</h2>
      <form id="projectForm">
        <label>
          Nombre
          <input type="text" name="name" maxlength="80" placeholder="Ej: Rediseño del sitio" required />
        </label>
        <label>
          Descripción (opcional)
          <textarea name="description" rows="3" maxlength="300" placeholder="¿De qué trata el proyecto?"></textarea>
        </label>
        <button type="submit" id="projectSubmit">Crear proyecto</button>
      </form>
      <div id="projectsStatus" class="status"></div>
    </div>

    <script>
      // Mismo origen cuando el backend sirve el frontend; localhost si se abre el archivo directo.
      const apiBase = window.location.protocol.startsWith('http') ? '' : 'http://localhost:3001';
      const tabs = document.querySelectorAll('.tab');
      const forms = {
        login: document.getElementById('loginForm'),
        register: document.getElementById('registerForm'),
        forgot: document.getElementById('forgotForm'),
        reset: document.getElementById('resetForm'),
      };
      const statusEl = document.getElementById('status');
      const resetToken = new URLSearchParams(window.location.search).get('token');

      function setMessage(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      function showForm(target) {
        tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === target));
        Object.entries(forms).forEach(([key, form]) => {
          form.classList.toggle('active', key === target);
        });
        setMessage('');
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          const target = tab.dataset.tab;
          showForm(target);
        });
      });

      document.getElementById('forgotPasswordLink').addEventListener('click', () => showForm('forgot'));
      document.getElementById('backToLoginLink').addEventListener('click', () => showForm('login'));

      // --- Sesión: renovación automática del access token ---
      // Si el servidor responde 401, se intenta /api/refresh una sola vez y se repite la petición.
      // Se comparte una única renovación en curso: el refresh token es de un solo uso, así que
      // dos renovaciones en paralelo harían que la segunda fallara.
      let refreshInFlight = null;

      function refreshSession() {
        if (!refreshInFlight) {
          refreshInFlight = fetch(`${apiBase}/api/refresh`, { method: 'POST', credentials: 'include' })
            .then((response) => response.ok)
            .catch(() => false)
            .finally(() => { refreshInFlight = null; });
        }
        return refreshInFlight;
      }

      // Usar esta función en vez de fetch para cualquier ruta protegida.
      async function fetchWithRefresh(path, options = {}) {
        const send = () => fetch(`${apiBase}${path}`, { ...options, credentials: 'include' });
        let response = await send();
        if (response.status === 401 && (await refreshSession())) {
          response = await send();
        }
        return response;
      }

      // --- Vistas: login <-> proyectos ---
      const authView = document.getElementById('authView');
      const projectsView = document.getElementById('projectsView');
      const projectListEl = document.getElementById('projectList');
      const projectForm = document.getElementById('projectForm');
      const projectSubmit = document.getElementById('projectSubmit');
      const projectsStatusEl = document.getElementById('projectsStatus');

      const roleLabels = { owner: 'Propietario', editor: 'Editor', viewer: 'Lector' };
      const stageLabels = {
        DEFINITION: 'Definición', DATA_MODEL: 'Modelo de datos', API: 'API', FRONTEND: 'Frontend', ARCHITECTURE: 'Arquitectura', REVIEW: 'Revisión',
      };
      const openProject = (id) => { window.location.href = `project.html?id=${encodeURIComponent(id)}`; };
      let projects = [];

      function setProjectsMessage(message, type = '') {
        projectsStatusEl.textContent = message;
        projectsStatusEl.className = `status ${type}`.trim();
      }

      // Vuelve a la pantalla de login (cierre de sesión o sesión vencida).
      function showAuthView(message = '', type = '') {
        projects = [];
        projectsView.hidden = true;
        authView.hidden = false;
        showForm('login');
        if (message) setMessage(message, type);
      }

      // Con sesión activa: muestra la vista de proyectos y carga la lista.
      function showSession(user) {
        authView.hidden = true;
        projectsView.hidden = false;
        document.getElementById('sessionUser').textContent = user?.name || user?.username || '';
        setProjectsMessage('');
        loadProjects();
      }

      // Se arma el DOM con textContent (no innerHTML): el nombre y la descripción los escribe el usuario,
      // y con innerHTML un nombre como <img onerror=...> ejecutaría código en el navegador (XSS).
      function renderProjects() {
        projectListEl.replaceChildren();

        if (projects.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty-state';
          empty.textContent = 'Aún no tienes proyectos. Crea el primero abajo.';
          projectListEl.appendChild(empty);
          return;
        }

        projects.forEach((project) => {
          const item = document.createElement('li');
          item.className = 'project-item';
          item.tabIndex = 0;
          item.setAttribute('role', 'link');
          item.addEventListener('click', () => openProject(project.id));
          item.addEventListener('keydown', (event) => { if (event.key === 'Enter') openProject(project.id); });

          const top = document.createElement('div');
          top.className = 'project-item-top';
          const name = document.createElement('span');
          name.className = 'project-name';
          name.textContent = project.name;
          const badge = document.createElement('span');
          badge.className = `role-badge ${project.role}`;
          badge.textContent = roleLabels[project.role] || project.role;
          top.append(name, badge);
          item.appendChild(top);

          if (project.description) {
            const description = document.createElement('p');
            description.className = 'project-description';
            description.textContent = project.description;
            item.appendChild(description);
          }

          const meta = document.createElement('p');
          meta.className = 'project-meta';
          meta.textContent = `${project.memberCount} ${project.memberCount === 1 ? 'miembro' : 'miembros'} · Etapa: ${stageLabels[project.currentStage] || project.currentStage}`;
          item.appendChild(meta);

          projectListEl.appendChild(item);
        });
      }

      // Si el servidor responde 401 incluso después de intentar renovar, la sesión terminó.
      function handleSessionExpired() {
        showAuthView('Tu sesión expiró. Inicia sesión de nuevo.', 'error');
      }

      async function loadProjects() {
        projectListEl.replaceChildren();
        const loading = document.createElement('li');
        loading.className = 'empty-state';
        loading.textContent = 'Cargando proyectos...';
        projectListEl.appendChild(loading);

        try {
          const response = await fetchWithRefresh('/api/projects');
          if (response.status === 401) return handleSessionExpired();
          const data = await response.json();
          if (!response.ok) {
            projectListEl.replaceChildren();
            setProjectsMessage(data.error || 'No se pudieron cargar los proyectos', 'error');
            return;
          }
          projects = data.projects;
          renderProjects();
        } catch (error) {
          projectListEl.replaceChildren();
          setProjectsMessage('No se pudo conectar con el servidor', 'error');
        }
      }

      projectForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(projectForm);
        const payload = {
          name: String(formData.get('name') || '').trim(),
          description: String(formData.get('description') || '').trim(),
        };

        // Validación en el cliente para dar feedback inmediato (el servidor valida igual).
        if (!payload.name) {
          setProjectsMessage('El nombre del proyecto es obligatorio', 'error');
          return;
        }

        projectSubmit.disabled = true; // evita crear duplicados con doble clic
        setProjectsMessage('Creando proyecto...');
        try {
          const response = await fetchWithRefresh('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (response.status === 401) return handleSessionExpired();
          const data = await response.json();

          if (!response.ok) {
            setProjectsMessage(data.error || 'No se pudo crear el proyecto', 'error');
            return;
          }

          projectForm.reset();
          openProject(data.project.id); // va directo al espacio de trabajo para empezar con la idea
        } catch (error) {
          setProjectsMessage('No se pudo conectar con el servidor', 'error');
        } finally {
          projectSubmit.disabled = false;
        }
      });

      document.getElementById('logoutButton').addEventListener('click', async () => {
        try {
          await fetch(`${apiBase}/api/logout`, { method: 'POST', credentials: 'include' });
          showAuthView('Sesión cerrada', 'success');
        } catch (error) {
          setProjectsMessage('No se pudo cerrar la sesión', 'error');
        }
      });

      async function restoreSession({ announceFailure = false } = {}) {
        try {
          const response = await fetchWithRefresh('/api/me');
          if (!response.ok) {
            if (announceFailure) setMessage(ssoErrorMessages.sso_failed, 'error');
            return;
          }
          const data = await response.json();
          showSession(data.user);
        } catch (error) {
          if (announceFailure) setMessage('No se pudo conectar con el servidor', 'error');
        }
      }

      // --- SSO ---
      const ssoErrorMessages = {
        sso_not_configured: 'El inicio de sesión con Google no está configurado en el servidor.',
        access_denied: 'Cancelaste el inicio de sesión con Google.',
        invalid_state: 'La solicitud de inicio de sesión no es válida o expiró. Intenta de nuevo.',
        email_not_verified: 'Tu cuenta de Google no tiene el correo verificado.',
        account_exists: 'Ese correo ya está registrado con contraseña. Inicia sesión con tu contraseña.',
        sso_failed: 'No se pudo completar el inicio de sesión con Google.',
      };

      // El botón solo navega al backend, que redirige a Google (no se puede usar fetch: es un redirect entre sitios).
      document.getElementById('ssoGoogleButton').addEventListener('click', (event) => {
        event.currentTarget.disabled = true;
        setMessage('Redirigiendo a Google...');
        window.location.href = `${apiBase}/api/auth/google`;
      });

      // Al volver de Google, el backend redirige a esta página con ?sso=success o ?sso_error=<código>.
      const urlParams = new URLSearchParams(window.location.search);
      const ssoError = urlParams.get('sso_error');
      const ssoSuccess = urlParams.get('sso') === 'success';
      if (ssoError || ssoSuccess) {
        // Se limpia la URL para que un F5 no repita el mensaje.
        window.history.replaceState({}, '', window.location.pathname);
      }

      forms.login.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.login);
        const payload = {
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch(`${apiBase}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'Error al iniciar sesión', 'error');
            return;
          }

          showSession(data.user);
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      forms.forgot.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.forgot);

        try {
          const response = await fetch(`${apiBase}/api/request-password-reset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: formData.get('username') }),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'No se pudo solicitar la recuperación', 'error');
            return;
          }

          setMessage(data.message, 'success');
          forms.forgot.reset();
          if (data.resetToken) {
            const resetUrl = `${window.location.origin}${window.location.pathname}?token=${encodeURIComponent(data.resetToken)}`;
            const link = document.createElement('a');
            link.className = 'dev-link';
            link.href = resetUrl;
            link.textContent = 'Abrir enlace de recuperación (desarrollo)';
            statusEl.appendChild(link);
          }
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      forms.reset.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.reset);
        const password = formData.get('password');
        const passwordConfirmation = formData.get('passwordConfirmation');

        if (password !== passwordConfirmation) {
          setMessage('Las contraseñas no coinciden', 'error');
          return;
        }

        try {
          const response = await fetch(`${apiBase}/api/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'No se pudo restablecer la contraseña', 'error');
            return;
          }

          setMessage(`${data.message}. Ya puedes iniciar sesión.`, 'success');
          forms.reset.reset();
        } catch (error) {
          setMessage('No se pudo conectar con el servidor', 'error');
        }
      });

      if (resetToken) {
        tabs.forEach((tab) => { tab.hidden = true; });
        showForm('reset');
      } else if (ssoError) {
        setMessage(ssoErrorMessages[ssoError] || ssoErrorMessages.sso_failed, 'error');
      } else {
        // Con ?sso=success se confirma la sesión y, si falla, se avisa.
        // Sin parámetros solo se restaura una sesión previa (renovándola si hace falta), sin mostrar errores.
        restoreSession({ announceFailure: ssoSuccess });
      }

      forms.register.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(forms.register);
        const payload = {
          name: formData.get('name'),
          username: formData.get('username'),
          password: formData.get('password'),
        };

        try {
          const response = await fetch(`${apiBase}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            setMessage(data.error || 'Error al registrar usuario', 'error');
            return;
          }

          setMessage('Registro exitoso. Ya puedes iniciar sesión.', 'success');
          forms.register.reset();
          tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.tab === 'login'));
          Object.entries(forms).forEach(([key, form]) => {
            form.classList.toggle('active', key === 'login');
          });
        } catch (error) {
          setMessage('No se pudo completar el registro', 'error');
        }
      });
    </script>
  </body>
</html>
